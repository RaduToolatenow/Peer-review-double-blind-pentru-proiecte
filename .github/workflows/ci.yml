name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://peer_review:ci_only_password@localhost:5432/peer_review_test
      TEST_DATABASE_URL: postgresql://peer_review:ci_only_password@localhost:5432/peer_review_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peer_review
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: peer_review_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peer_review -d peer_review_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Ledger lint
        run: python3 docs/agents/tools/ledger-lint.py
