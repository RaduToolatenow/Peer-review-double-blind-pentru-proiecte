<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DS-pr-join-team</title>
    <link rel="stylesheet" href="../../../web/src/tokens.css" />
    <link rel="stylesheet" href="../../../web/src/styles.css" />
    <link rel="stylesheet" href="components.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <p class="brand">Peer review</p>
        <button class="secondary" type="button">Deconectare</button>
      </header>
      <main>
        <div class="card centered">
          <h1>Intră în echipa ta</h1>
          <p class="muted">Introdu codul primit de la profesor. Îl folosești o singură dată pentru fiecare clasă.</p>
          <div class="field"><label for="code">Codul echipei</label><input id="code" value="K7P-4QX" autocomplete="off" /></div>
          <p class="error" role="alert">! Codul nu există. Verifică-l sau cere-i profesorului unul nou.</p>
          <button class="primary" type="button">Intră în echipă</button>
          <p class="muted after">Profesorul vede doar câte persoane au intrat în echipă, nu cine.</p>
        </div>
      </main>
    </div>
  </body>
</html>
