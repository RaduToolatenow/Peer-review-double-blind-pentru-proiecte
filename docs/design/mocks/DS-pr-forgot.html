<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="../../../web/src/tokens.css" />
    <link rel="stylesheet" href="../../../web/src/styles.css" />
  </head>
  <body>
    <main class="center">
      <div class="stack">
        <span class="brand"><img src="../../../web/public/logo.svg" alt="" /><span><strong>Peer review</strong><small>evaluare între colegi</small></span></span>
        <form class="card" novalidate>
          <h1>Am uitat parola</h1>
          <p class="muted">Îți trimitem un link pentru o parolă nouă, valabil o oră.</p>
          <div class="field"><label for="email">Emailul de la universitate</label><input id="email" type="email" /></div>
          <p role="status" class="notice">Dacă există un cont cu această adresă, ți-am trimis un link pentru o parolă nouă. Verifică și folderul Spam.</p>
          <button class="primary" type="button">Trimite linkul</button>
          <p class="links"><a href="#">Înapoi la autentificare</a></p>
        </form>
      </div>
    </main>
