<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DS-pr-reset</title>
    <link rel="stylesheet" href="../../../node_modules/@fontsource-variable/inter/index.css" />
    <link rel="stylesheet" href="../../../web/src/tokens.css" />
    <link rel="stylesheet" href="../../../web/src/styles.css" />
  </head>
  <body>
    <main class="center">
      <div class="stack">
        <span class="brand"><img src="../../../web/public/logo.svg" alt="" /><span><strong>Peer review</strong><small>evaluare între colegi</small></span></span>
        <form class="card" novalidate>
          <h1>Parolă nouă</h1>
          <p class="muted">După schimbare, contul se deconectează de pe toate dispozitivele.</p>
          <!-- D-030: the rule under the field. -->
          <div class="field"><label for="p1">Parola nouă</label><input id="p1" type="password" aria-describedby="p1-hint" /><span class="muted" id="p1-hint">Minim 10 caractere; nu o parolă des folosită și nu numele din adresa ta.</span></div>
          <div class="field"><label for="p2">Repetă parola</label><input id="p2" type="password" /></div>
          <p class="error" role="alert">! Parolele nu sunt la fel.</p>
          <button class="primary" type="button">Schimbă parola</button>
        </form>
      </div>
    </main>
  </body>
</html>
